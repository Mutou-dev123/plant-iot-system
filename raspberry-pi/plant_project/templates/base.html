{% load static %}

<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        {% block title %}
            ObserLeaf
        {% endblock %}
    </title>

    <!-- 共通CSS -->
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/menu.css' %}">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.468.0"></script>

    <!-- ページごとのCSS -->
    {% block css %}
    {% endblock %}
</head>

<body>

    <header>

        <button id="menu-button" type="button" aria-label="メニューを開く">
            <i data-lucide="menu" aria-hidden="true"></i>
        </button>

        <h2>
            <i data-lucide="leaf" aria-hidden="true"></i>
            ObserLeaf
        </h2>

        <div id="realtime-clock">
            --:--:--
        </div>

    </header>

    <!-- サイドメニュー -->
    <nav id="sidebar">

        <ul>

            <li>
                <a href="{% url 'dashboard' %}">
                    <i data-lucide="layout-dashboard" aria-hidden="true"></i>
                    ダッシュボード
                </a>
            </li>

            <li>
                <a href="{% url 'daily_summary_list' %}">
                    <i data-lucide="calendar-days" aria-hidden="true"></i>
                    センサー推移
                </a>
            </li>

            <li>
                <a href="{% url 'plant_list' %}">
                    <i data-lucide="sprout" aria-hidden="true"></i>
                    植物一覧
                </a>
            </li>

            <li>
                <a href="{% url 'device_list' %}">
                    <i data-lucide="cpu" aria-hidden="true"></i>
                    デバイス一覧
                </a>
            </li>
        </ul>
    </nav>

    <main>

        {% block content %}
        {% endblock %}

    </main>

    <!-- 共通JS -->
    <script src="{% static 'js/clock.js' %}"></script>
    <script src="{% static 'js/menu.js' %}"></script>

    <script>
        // data-lucide属性をSVGアイコンへ変換する
        lucide.createIcons();
    </script>

    <!-- ページごとのJS -->
    {% block js %}
    {% endblock %}
    
</body>
</html>
